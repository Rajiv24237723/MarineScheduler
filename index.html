      DIRECTION CONTRACT — "Bathymetric Blue"
      THESIS: Marine Scheduler reads like an admiralty sea chart — deep-ocean ink,
        fine graticule linework, and a single depth-contour cyan that carries meaning;
        it refuses the near-black radar-console default and the flag-signal metaphor.
      OWN-WORLD: deep-ocean blue ground (#0a2540); one luminous depth-contour cyan
        accent (#49b4c4) for state and action; hairline chart rules divide dense
        readings; Newsreader serif for chart titles and hero soundings, Inter for UI,
        JetBrains Mono for inline figures; triangular chart ticks flag exceptions.
      STORY: a planner reads plan state like depths on a chart, drills into any sounding,
        and acts.
      FIRST VIEWPORT: Command Center — a plan-signal band (version, served %, achievable)
        over a graticule strip of KPI soundings and a tick-ranked exception stack;
        primary action top-right.
      FORM: Bathymetric Blue — nautical-chart world; Operate.
    -->
